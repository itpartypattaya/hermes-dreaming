<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620">
  <style>
    text { font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace; }
    .name { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .sub { fill: #94a3b8; font-size: 9.5px; }
    .tiny { fill: #94a3b8; font-size: 9px; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: 1px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="a-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="a-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="a-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="a-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="a-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
  </defs>

  <rect width="1200" height="620" fill="#0f172a"/>
  <rect width="1200" height="620" fill="url(#grid)"/>

  <!-- lanes -->
  <rect x="30" y="100" width="1140" height="220" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="120" class="lane" fill="#34d399">A CANDIDATE FACT</text>
  <rect x="30" y="345" width="1140" height="250" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="365" class="lane" fill="#a78bfa">A MEMORY ENTRY</text>

  <!-- lane A arrows -->
  <line x1="230" y1="188" x2="298" y2="188" stroke="#34d399" stroke-width="1.2" marker-end="url(#a-emerald)"/>
  <text x="236" y="180" class="tiny">corroborated</text>
  <line x1="480" y1="188" x2="543" y2="188" stroke="#34d399" stroke-width="1.2" marker-end="url(#a-emerald)"/>
  <path d="M 610 150 L 610 140 L 758 140" fill="none" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#a-violet)"/>
  <text x="620" y="133" class="tiny">write</text>
  <line x1="675" y1="194" x2="758" y2="194" stroke="#fb7185" stroke-width="1.2" marker-end="url(#a-rose)"/>
  <text x="684" y="186" class="tiny">reject</text>
  <path d="M 610 226 L 610 272 L 390 272 L 390 218" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a-rose)"/>
  <text x="408" y="290" fill="#fb7185" font-size="9">no outcome → back tomorrow (there is no third option)</text>

  <!-- lane A components -->
  <rect x="50" y="160" width="180" height="56" rx="6" fill="#0f172a"/>
  <rect x="50" y="160" width="180" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="140" y="184" class="name" text-anchor="middle">fact store</text>
  <text x="140" y="202" class="sub" text-anchor="middle">extracted or mirrored</text>

  <rect x="300" y="160" width="180" height="56" rx="6" fill="#0f172a"/>
  <rect x="300" y="160" width="180" height="56" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="390" y="184" class="name" text-anchor="middle">promotion</text>
  <text x="390" y="202" class="sub" text-anchor="middle">proposed to the agent</text>

  <g transform="translate(610, 188)">
    <polygon points="0,-38 65,0 0,38 -65,0" fill="#0f172a"/>
    <polygon points="0,-38 65,0 0,38 -65,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-2" class="name" text-anchor="middle">agent</text>
    <text y="13" class="sub" text-anchor="middle">decides</text>
  </g>

  <rect x="760" y="118" width="230" height="44" rx="6" fill="#0f172a"/>
  <rect x="760" y="118" width="230" height="44" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="875" y="137" class="name" text-anchor="middle">in MEMORY / USER</text>
  <text x="875" y="153" class="sub" text-anchor="middle">never proposed again</text>

  <rect x="760" y="172" width="230" height="44" rx="6" fill="#0f172a"/>
  <rect x="760" y="172" width="230" height="44" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="875" y="191" class="name" text-anchor="middle">reject list</text>
  <text x="875" y="207" class="sub" text-anchor="middle">silenced by text · --undo lifts it</text>

  <rect x="1010" y="140" width="150" height="76" rx="6" fill="#0f172a"/>
  <rect x="1010" y="140" width="150" height="76" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1085" y="160" class="name" text-anchor="middle" font-size="11">new facts,</text>
  <text x="1085" y="175" class="name" text-anchor="middle" font-size="11">conflicts</text>
  <text x="1085" y="192" class="sub" text-anchor="middle">"nothing here" is ok:</text>
  <text x="1085" y="206" class="sub" text-anchor="middle">quiet for 14 days</text>

  <!-- lane B arrows -->
  <line x1="230" y1="448" x2="298" y2="448" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#a-violet)"/>
  <text x="236" y="440" class="tiny">silent 60 d</text>
  <path d="M 360 420 L 360 398 L 440 398 L 440 418" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a-rose)"/>
  <text x="196" y="402" fill="#fb7185" font-size="9">no agent answer → asked again</text>
  <path d="M 500 438 L 550 438 L 550 405 L 598 405" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-slate)"/>
  <text x="503" y="431" class="tiny">outdated</text>
  <path d="M 500 458 L 550 458 L 550 485 L 598 485" fill="none" stroke="#34d399" stroke-width="1.2" marker-end="url(#a-emerald)"/>
  <text x="503" y="472" class="tiny">kept</text>
  <path d="M 820 485 L 860 485 L 860 568 L 140 568 L 140 478" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a-violet)"/>
  <text x="380" y="561" class="tiny">90 days later it may be asked again</text>

  <!-- lane B components -->
  <rect x="50" y="420" width="180" height="56" rx="6" fill="#0f172a"/>
  <rect x="50" y="420" width="180" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="140" y="444" class="name" text-anchor="middle">memory entry</text>
  <text x="140" y="462" class="sub" text-anchor="middle">MEMORY.md §</text>
  <text x="150" y="504" class="tiny">pinned entries are never asked</text>

  <rect x="300" y="420" width="200" height="56" rx="6" fill="#0f172a"/>
  <rect x="300" y="420" width="200" height="56" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="444" class="name" text-anchor="middle">"still relevant?"</text>
  <text x="400" y="462" class="sub" text-anchor="middle">asked once · 14-day cooldown</text>

  <rect x="600" y="380" width="220" height="50" rx="6" fill="#0f172a"/>
  <rect x="600" y="380" width="220" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="710" y="401" class="name" text-anchor="middle">removed or replaced</text>
  <text x="710" y="418" class="sub" text-anchor="middle">by the agent, on the human's word</text>

  <rect x="600" y="460" width="220" height="50" rx="6" fill="#0f172a"/>
  <rect x="600" y="460" width="220" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="710" y="481" class="name" text-anchor="middle">confirmed</text>
  <text x="710" y="498" class="sub" text-anchor="middle">kept 14 days, or rewritten</text>

  <rect x="900" y="420" width="250" height="76" rx="6" fill="#0f172a"/>
  <rect x="900" y="420" width="250" height="76" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1025" y="442" class="name" text-anchor="middle" font-size="11">a rewrite is the same entry</text>
  <text x="1025" y="460" class="sub" text-anchor="middle">"As of 2026-09-23, …" inherits the</text>
  <text x="1025" y="474" class="sub" text-anchor="middle">question's record by subject,</text>
  <text x="1025" y="488" class="sub" text-anchor="middle">so it is not asked again tomorrow</text>

  <!-- title -->
  <text x="40" y="52" fill="#ffffff" font-size="20" font-weight="700">Where every item ends up</text>
  <text x="40" y="76" fill="#94a3b8" font-size="12">each candidate and question gets an outcome — nothing is asked forever</text>
</svg>
