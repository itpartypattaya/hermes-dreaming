<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <style>
    text { font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace; }
    .title { fill: #ffffff; font-size: 20px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .name { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .sub { fill: #94a3b8; font-size: 9.5px; }
    .tiny { fill: #94a3b8; font-size: 9px; }
    .warn { fill: #fb7185; font-size: 9px; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: 1px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="a-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="a-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="a-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="a-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="40" y="52" class="title">Where every item ends up</text>
  <text x="40" y="76" class="subtitle">each candidate and question gets an outcome — nothing is asked forever</text>

  <!-- ===== candidate fact lane ===== -->
  <rect x="30" y="100" width="1140" height="300" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="118" class="lane" fill="#34d399">A CANDIDATE FACT</text>

  <rect x="50" y="160" width="180" height="62" rx="6" fill="#0f172a"/>
  <rect x="50" y="160" width="180" height="62" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="140" y="183" class="name" text-anchor="middle">fact store</text>
  <text x="140" y="200" class="sub" text-anchor="middle">extracted, mirrored, said</text>
  <text x="140" y="213" class="sub" text-anchor="middle">or inferred</text>

  <line x1="230" y1="191" x2="298" y2="191" stroke="#34d399" stroke-width="1.2" marker-end="url(#a-green)"/>
  <text x="236" y="184" class="tiny">corroborated</text>

  <rect x="300" y="152" width="190" height="78" rx="6" fill="#0f172a"/>
  <rect x="300" y="152" width="190" height="78" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="395" y="175" class="name" text-anchor="middle">promotion</text>
  <text x="395" y="192" class="sub" text-anchor="middle">score ≥ 0.55; said on 2 days,</text>
  <text x="395" y="205" class="sub" text-anchor="middle">or 3 mentions, or used and</text>
  <text x="395" y="218" class="sub" text-anchor="middle">found helpful</text>

  <line x1="490" y1="191" x2="538" y2="191" stroke="#34d399" stroke-width="1.2" marker-end="url(#a-green)"/>

  <g transform="translate(605, 191)">
    <polygon points="0,-40 65,0 0,40 -65,0" fill="#0f172a"/>
    <polygon points="0,-40 65,0 0,40 -65,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-3" class="name" text-anchor="middle">agent</text>
    <text y="13" class="sub" text-anchor="middle">decides</text>
  </g>

  <polyline points="605,151 605,138 768,138" fill="none" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#a-violet)"/>
  <text x="620" y="132" class="tiny">write</text>
  <rect x="770" y="116" width="220" height="56" rx="6" fill="#0f172a"/>
  <rect x="770" y="116" width="220" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="880" y="138" class="name" text-anchor="middle">in MEMORY / USER</text>
  <text x="880" y="155" class="sub" text-anchor="middle">not proposed while the entry is there</text>

  <line x1="670" y1="191" x2="768" y2="208" stroke="#fb7185" stroke-width="1.2" marker-end="url(#a-rose)"/>
  <text x="684" y="188" class="tiny">reject</text>
  <rect x="770" y="186" width="220" height="70" rx="6" fill="#0f172a"/>
  <rect x="770" y="186" width="220" height="70" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="880" y="208" class="name" text-anchor="middle">reject list</text>
  <text x="880" y="225" class="sub" text-anchor="middle">by its text · --undo lifts it</text>
  <text x="880" y="238" class="sub" text-anchor="middle">said again after 180 days:</text>
  <text x="880" y="250" class="sub" text-anchor="middle">asked, never written</text>

  <polyline points="605,231 605,262 395,262 395,232" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a-rose)"/>
  <text x="430" y="278" class="warn">no outcome → back in 3 days (an unanswered night: the next night)</text>

  <rect x="1010" y="116" width="150" height="140" rx="6" fill="#0f172a"/>
  <rect x="1010" y="116" width="150" height="140" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1085" y="138" class="name" text-anchor="middle">rides along</text>
  <text x="1085" y="156" class="sub" text-anchor="middle">never wakes the agent</text>
  <text x="1085" y="176" class="sub" text-anchor="middle">confirm: said again</text>
  <text x="1085" y="189" class="sub" text-anchor="middle">on 2 days → +0.05,</text>
  <text x="1085" y="202" class="sub" text-anchor="middle">rest 30 days</text>
  <text x="1085" y="222" class="sub" text-anchor="middle">rejected, trusted →</text>
  <text x="1085" y="235" class="sub" text-anchor="middle">unhelpful (−0.10)</text>
  <text x="1085" y="248" class="sub" text-anchor="middle">no keywords → 3–8</text>

  <rect x="50" y="300" width="250" height="80" rx="6" fill="#0f172a"/>
  <rect x="50" y="300" width="250" height="80" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="175" y="322" class="name" text-anchor="middle">quarantine</text>
  <text x="175" y="339" class="sub" text-anchor="middle">a secret or an instruction: wakes</text>
  <text x="175" y="352" class="sub" text-anchor="middle">the agent, never shown; closed</text>
  <text x="175" y="365" class="sub" text-anchor="middle">by the reject list</text>

  <rect x="320" y="300" width="250" height="80" rx="6" fill="#0f172a"/>
  <rect x="320" y="300" width="250" height="80" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="445" y="322" class="name" text-anchor="middle">inferred</text>
  <text x="445" y="339" class="sub" text-anchor="middle">a conclusion nobody confirmed:</text>
  <text x="445" y="352" class="sub" text-anchor="middle">the agent asks, it does not write</text>
  <text x="445" y="365" class="sub" text-anchor="middle">it as what it was told</text>

  <rect x="590" y="300" width="270" height="80" rx="6" fill="#0f172a"/>
  <rect x="590" y="300" width="270" height="80" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="725" y="322" class="name" text-anchor="middle">new facts, conflicts, decays</text>
  <text x="725" y="339" class="sub" text-anchor="middle">shown once in 14 days; "nothing</text>
  <text x="725" y="352" class="sub" text-anchor="middle">here" is fine · an event whose date</text>
  <text x="725" y="365" class="sub" text-anchor="middle">has passed is only listed</text>

  <rect x="880" y="300" width="280" height="80" rx="6" fill="#0f172a"/>
  <rect x="880" y="300" width="280" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1020" y="322" class="name" text-anchor="middle">forgotten in the store</text>
  <text x="1020" y="339" class="sub" text-anchor="middle">the sweep (every 15 min) takes its</text>
  <text x="1020" y="352" class="sub" text-anchor="middle">copies out of the caches, the reject</text>
  <text x="1020" y="365" class="sub" text-anchor="middle">list, the diary and the job logs</text>

  <!-- ===== memory entry lane ===== -->
  <rect x="30" y="420" width="1140" height="250" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="438" class="lane" fill="#a78bfa">A MEMORY ENTRY</text>

  <rect x="50" y="480" width="180" height="58" rx="6" fill="#0f172a"/>
  <rect x="50" y="480" width="180" height="58" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="140" y="503" class="name" text-anchor="middle">memory entry</text>
  <text x="140" y="520" class="sub" text-anchor="middle">MEMORY.md §</text>

  <line x1="230" y1="509" x2="298" y2="509" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#a-violet)"/>
  <text x="236" y="502" class="tiny">silent 60 d</text>

  <rect x="300" y="480" width="200" height="58" rx="6" fill="#0f172a"/>
  <rect x="300" y="480" width="200" height="58" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="503" class="name" text-anchor="middle">"still relevant?"</text>
  <text x="400" y="520" class="sub" text-anchor="middle">asked once · 14-day cooldown</text>

  <path d="M 360 480 L 360 460 L 440 460 L 440 478" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a-rose)"/>
  <text x="300" y="454" class="warn">no answer that night → asked again</text>

  <polyline points="500,495 548,495 548,470 598,470" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-slate)"/>
  <text x="506" y="488" class="tiny">outdated</text>
  <rect x="600" y="446" width="260" height="56" rx="6" fill="#0f172a"/>
  <rect x="600" y="446" width="260" height="56" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="730" y="467" class="name" text-anchor="middle">removed or replaced</text>
  <text x="730" y="484" class="sub" text-anchor="middle">by the agent, on the human's word;</text>
  <text x="730" y="496" class="sub" text-anchor="middle">a fact: end · change · correct · forget</text>

  <polyline points="500,523 548,523 548,548 598,548" fill="none" stroke="#34d399" stroke-width="1.2" marker-end="url(#a-green)"/>
  <text x="506" y="540" class="tiny">kept</text>
  <rect x="600" y="520" width="260" height="56" rx="6" fill="#0f172a"/>
  <rect x="600" y="520" width="260" height="56" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="730" y="542" class="name" text-anchor="middle">confirmed</text>
  <text x="730" y="559" class="sub" text-anchor="middle">kept 14 days, or rewritten</text>

  <polyline points="860,548 900,548 900,630 140,630 140,540" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a-violet)"/>
  <text x="420" y="646" class="tiny">90 days later it may be asked again</text>
  <text x="150" y="590" class="tiny">pinned entries (📌, [pinned]) are never asked;</text>
  <text x="150" y="603" class="tiny">nor one whose change waits for approval</text>

  <rect x="930" y="470" width="220" height="96" rx="6" fill="#0f172a"/>
  <rect x="930" y="470" width="220" height="96" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1040" y="492" class="name" text-anchor="middle">a rewrite is the same entry</text>
  <text x="1040" y="510" class="sub" text-anchor="middle">"As of 2026-09-23, …" inherits</text>
  <text x="1040" y="523" class="sub" text-anchor="middle">the question's record by subject,</text>
  <text x="1040" y="536" class="sub" text-anchor="middle">so it is not asked again tomorrow;</text>
  <text x="1040" y="549" class="sub" text-anchor="middle">USER.md is never asked about</text>
</svg>
