<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570">
  <style>
    text { font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace; }
    .name { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .sub { fill: #94a3b8; font-size: 9.5px; }
    .tiny { fill: #94a3b8; font-size: 9px; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: 1px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="a-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="a-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/></marker>
  </defs>

  <rect width="1200" height="570" fill="#0f172a"/>
  <rect width="1200" height="570" fill="url(#grid)"/>

  <!-- regions -->
  <rect x="30" y="112" width="290" height="270" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="131" class="lane" fill="#22d3ee">READS · read-only</text>
  <rect x="880" y="112" width="290" height="270" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="894" y="131" class="lane" fill="#34d399">SCRIPTS WRITE</text>
  <rect x="880" y="392" width="290" height="140" rx="12" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="894" y="411" class="lane" fill="#60a5fa">THE AGENT WRITES</text>

  <!-- arrows: reads → scripts -->
  <path d="M 300 178 L 380 178 L 380 222 L 438 222" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-slate)"/>
  <path d="M 300 258 L 380 258 L 380 242 L 438 242" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-slate)"/>
  <path d="M 300 338 L 380 338 L 380 262 L 438 262" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-slate)"/>
  <!-- scripts → writes -->
  <path d="M 760 242 L 830 242 L 830 178 L 908 178" fill="none" stroke="#34d399" stroke-width="1.2" marker-end="url(#a-emerald)"/>
  <path d="M 830 242 L 830 258 L 908 258" fill="none" stroke="#34d399" stroke-width="1.2" marker-end="url(#a-emerald)"/>
  <path d="M 830 258 L 830 338 L 908 338" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a-emerald)"/>
  <text x="836" y="356" class="tiny">install</text>
  <!-- scripts → agent -->
  <line x1="600" y1="280" x2="600" y2="398" stroke="#34d399" stroke-width="1.2" marker-end="url(#a-emerald)"/>
  <text x="608" y="334" class="tiny">compact JSON,</text>
  <text x="608" y="346" class="tiny">only when there is work</text>
  <!-- agent → writes -->
  <path d="M 760 420 L 830 420 L 830 452 L 908 452" fill="none" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#a-blue)"/>
  <path d="M 830 452 L 830 504 L 908 504" fill="none" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#a-blue)"/>

  <!-- reads -->
  <rect x="50" y="150" width="250" height="56" rx="6" fill="#0f172a"/>
  <rect x="50" y="150" width="250" height="56" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="175" y="174" class="name" text-anchor="middle">state.db</text>
  <text x="175" y="192" class="sub" text-anchor="middle">sessions · messages · mode=ro</text>

  <rect x="50" y="230" width="250" height="56" rx="6" fill="#0f172a"/>
  <rect x="50" y="230" width="250" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="175" y="254" class="name" text-anchor="middle">fact store</text>
  <text x="175" y="272" class="sub" text-anchor="middle">SQLite mode=ro, or a JSONL file</text>

  <rect x="50" y="310" width="250" height="56" rx="6" fill="#0f172a"/>
  <rect x="50" y="310" width="250" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="175" y="334" class="name" text-anchor="middle">MEMORY.md · USER.md</text>
  <text x="175" y="352" class="sub" text-anchor="middle">dedupe · decay · fill level</text>

  <!-- center -->
  <rect x="440" y="205" width="320" height="75" rx="6" fill="#0f172a"/>
  <rect x="440" y="205" width="320" height="75" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="232" class="name" text-anchor="middle">dream.py + two cron gates</text>
  <text x="600" y="250" class="sub" text-anchor="middle">Python stdlib · no network · no LLM</text>
  <text x="600" y="266" class="sub" text-anchor="middle">run by the Hermes scheduler</text>

  <rect x="440" y="400" width="320" height="60" rx="6" fill="#0f172a"/>
  <rect x="440" y="400" width="320" height="60" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="600" y="425" class="name" text-anchor="middle">agent in the cron session</text>
  <text x="600" y="443" class="sub" text-anchor="middle">the only LLM turn · your model, your tools</text>

  <!-- script writes -->
  <rect x="910" y="150" width="240" height="56" rx="6" fill="#0f172a"/>
  <rect x="910" y="150" width="240" height="56" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1030" y="174" class="name" text-anchor="middle">cache/dream-*.json</text>
  <text x="1030" y="192" class="sub" text-anchor="middle">cooldowns · rejects · snapshot</text>

  <rect x="910" y="230" width="240" height="56" rx="6" fill="#0f172a"/>
  <rect x="910" y="230" width="240" height="56" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1030" y="254" class="name" text-anchor="middle">memories/DREAMS.md</text>
  <text x="1030" y="272" class="sub" text-anchor="middle">diary · one section per night</text>

  <rect x="910" y="310" width="240" height="56" rx="6" fill="#0f172a"/>
  <rect x="910" y="310" width="240" height="56" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1030" y="334" class="name" text-anchor="middle">scripts/dream-*.py</text>
  <text x="1030" y="352" class="sub" text-anchor="middle">gate copies · install.py only</text>

  <!-- agent writes -->
  <rect x="910" y="428" width="240" height="48" rx="6" fill="#0f172a"/>
  <rect x="910" y="428" width="240" height="48" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1030" y="448" class="name" text-anchor="middle">MEMORY.md · USER.md</text>
  <text x="1030" y="465" class="sub" text-anchor="middle">via the memory tool · ≤ 6 changes</text>

  <rect x="910" y="482" width="240" height="44" rx="6" fill="#0f172a"/>
  <rect x="910" y="482" width="240" height="44" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1030" y="501" class="name" text-anchor="middle">fact store</text>
  <text x="1030" y="517" class="sub" text-anchor="middle">fact_store add · weekly extraction</text>

  <!-- never -->
  <rect x="30" y="480" width="770" height="52" rx="8" fill="rgba(136,19,55,0.25)" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="46" y="501" fill="#fb7185" font-size="10" font-weight="600">NEVER</text>
  <text x="46" y="519" fill="#fecdd3" font-size="10">network calls · LLM calls from scripts · deleting facts · writing memory files directly · credentials</text>

  <!-- title -->
  <text x="40" y="52" fill="#ffffff" font-size="20" font-weight="700">What it reads and writes</text>
  <text x="40" y="76" fill="#94a3b8" font-size="12">every file the skill touches, and who touches it</text>
</svg>
