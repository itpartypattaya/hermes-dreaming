<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660">
  <style>
    text { font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace; }
    .title { fill: #ffffff; font-size: 20px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .name { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .sub { fill: #94a3b8; font-size: 9.5px; }
    .tiny { fill: #94a3b8; font-size: 9px; }
    .lane { font-size: 10px; font-weight: 600; letter-spacing: 1px; }
    .never { fill: #fecdd3; font-size: 10px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="a-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="40" y="52" class="title">What it reads and writes</text>
  <text x="40" y="76" class="subtitle">every file the skill touches, and who touches it</text>

  <!-- reads -->
  <rect x="30" y="100" width="300" height="420" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="118" class="lane" fill="#22d3ee">READS · read-only</text>

  <rect x="50" y="132" width="260" height="50" rx="6" fill="#0f172a"/>
  <rect x="50" y="132" width="260" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="180" y="153" class="name" text-anchor="middle">state.db</text>
  <text x="180" y="170" class="sub" text-anchor="middle">sessions · messages · mode=ro</text>

  <rect x="50" y="194" width="260" height="62" rx="6" fill="#0f172a"/>
  <rect x="50" y="194" width="260" height="62" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="180" y="215" class="name" text-anchor="middle">fact store</text>
  <text x="180" y="232" class="sub" text-anchor="middle">SQLite mode=ro, or a JSONL file;</text>
  <text x="180" y="245" class="sub" text-anchor="middle">per-user and per-chat stores too</text>

  <rect x="50" y="268" width="260" height="50" rx="6" fill="#0f172a"/>
  <rect x="50" y="268" width="260" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="180" y="289" class="name" text-anchor="middle">MEMORY.md · USER.md</text>
  <text x="180" y="306" class="sub" text-anchor="middle">dedupe · decay · fill level</text>

  <rect x="50" y="330" width="260" height="62" rx="6" fill="#0f172a"/>
  <rect x="50" y="330" width="260" height="62" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="180" y="351" class="name" text-anchor="middle">settings and queues</text>
  <text x="180" y="368" class="sub" text-anchor="middle">dreaming.json · config.yaml</text>
  <text x="180" y="381" class="sub" text-anchor="middle">pending/memory (approvals)</text>

  <rect x="50" y="404" width="260" height="50" rx="6" fill="#0f172a"/>
  <rect x="50" y="404" width="260" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="180" y="425" class="name" text-anchor="middle">scripts/holo_screen.py</text>
  <text x="180" y="442" class="sub" text-anchor="middle">holographic's screen, copied verbatim</text>

  <rect x="50" y="466" width="260" height="42" rx="6" fill="#0f172a"/>
  <rect x="50" y="466" width="260" height="42" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="180" y="485" class="name" text-anchor="middle">cron/jobs.json · cron/output</text>
  <text x="180" y="500" class="sub" text-anchor="middle">the forget sweep only</text>

  <line x1="310" y1="157" x2="418" y2="226" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-slate)"/>
  <line x1="310" y1="225" x2="418" y2="240" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-slate)"/>
  <line x1="310" y1="293" x2="418" y2="254" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-slate)"/>
  <line x1="310" y1="361" x2="418" y2="266" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-slate)"/>
  <line x1="310" y1="429" x2="418" y2="274" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-slate)"/>
  <line x1="310" y1="487" x2="418" y2="280" stroke="#64748b" stroke-width="1.2" marker-end="url(#a-slate)"/>

  <!-- scripts -->
  <rect x="420" y="200" width="330" height="96" rx="6" fill="#0f172a"/>
  <rect x="420" y="200" width="330" height="96" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="585" y="223" class="name" text-anchor="middle">dream.py + three cron gates</text>
  <text x="585" y="241" class="sub" text-anchor="middle">dream-precheck · dream-extract-precheck</text>
  <text x="585" y="254" class="sub" text-anchor="middle">dream-forget-sweep · Python stdlib</text>
  <text x="585" y="267" class="sub" text-anchor="middle">no network · no LLM · run by the Hermes</text>
  <text x="585" y="280" class="sub" text-anchor="middle">scheduler; dream-reject.py by hand</text>

  <line x1="585" y1="296" x2="585" y2="392" stroke="#34d399" stroke-width="1.2" marker-end="url(#a-green)"/>
  <text x="594" y="336" class="tiny">compact JSON, only when</text>
  <text x="594" y="348" class="tiny">there is work</text>

  <rect x="420" y="394" width="330" height="62" rx="6" fill="#0f172a"/>
  <rect x="420" y="394" width="330" height="62" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="585" y="417" class="name" text-anchor="middle">agent in the cron session</text>
  <text x="585" y="434" class="sub" text-anchor="middle">the only LLM turns · your model ·</text>
  <text x="585" y="447" class="sub" text-anchor="middle">the memory tool, fact_store at extraction</text>

  <!-- script writes -->
  <rect x="800" y="100" width="370" height="290" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="814" y="118" class="lane" fill="#34d399">SCRIPTS WRITE · 0600</text>

  <rect x="820" y="132" width="330" height="76" rx="6" fill="#0f172a"/>
  <rect x="820" y="132" width="330" height="76" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="985" y="153" class="name" text-anchor="middle">cache/dream*.json</text>
  <text x="985" y="170" class="sub" text-anchor="middle">the night's payload · cooldowns · rejects</text>
  <text x="985" y="183" class="sub" text-anchor="middle">questions · snapshot · extraction cursor</text>
  <text x="985" y="196" class="sub" text-anchor="middle">diary index · sweep state · a lock</text>

  <rect x="820" y="220" width="330" height="50" rx="6" fill="#0f172a"/>
  <rect x="820" y="220" width="330" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="985" y="241" class="name" text-anchor="middle">memories/DREAMS.md</text>
  <text x="985" y="258" class="sub" text-anchor="middle">diary · one section a night · archive after 90</text>

  <rect x="820" y="282" width="330" height="50" rx="6" fill="#0f172a"/>
  <rect x="820" y="282" width="330" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="985" y="303" class="name" text-anchor="middle">scripts/dream-*.py</text>
  <text x="985" y="320" class="sub" text-anchor="middle">the three gate copies · install.py only</text>

  <rect x="820" y="344" width="330" height="36" rx="6" fill="#0f172a"/>
  <rect x="820" y="344" width="330" height="36" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="985" y="366" class="sub" text-anchor="middle">deletes: a job log that quotes a forgotten fact</text>

  <polyline points="750,224 785,224 785,170 818,170" fill="none" stroke="#34d399" stroke-width="1.2" marker-end="url(#a-green)"/>
  <polyline points="750,240 785,240 785,245 818,245" fill="none" stroke="#34d399" stroke-width="1.2" marker-end="url(#a-green)"/>
  <polyline points="750,256 772,256 772,307 818,307" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a-green)"/>
  <polyline points="750,272 762,272 762,362 818,362" fill="none" stroke="#34d399" stroke-width="1.2" marker-end="url(#a-green)"/>

  <!-- agent writes -->
  <rect x="800" y="410" width="370" height="160" rx="12" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="814" y="428" class="lane" fill="#60a5fa">THE AGENT WRITES</text>

  <rect x="820" y="440" width="330" height="50" rx="6" fill="#0f172a"/>
  <rect x="820" y="440" width="330" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="985" y="461" class="name" text-anchor="middle">MEMORY.md · USER.md</text>
  <text x="985" y="478" class="sub" text-anchor="middle">via the memory tool · ≤ 6 changes, ≤ 3 new</text>

  <rect x="820" y="500" width="330" height="60" rx="6" fill="#0f172a"/>
  <rect x="820" y="500" width="330" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="985" y="521" class="name" text-anchor="middle">fact store</text>
  <text x="985" y="538" class="sub" text-anchor="middle">add (extraction) · update (keywords) ·</text>
  <text x="985" y="551" class="sub" text-anchor="middle">fact_feedback · end/change/correct/forget*</text>

  <polyline points="750,425 785,425 785,465 818,465" fill="none" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#a-blue)"/>
  <polyline points="750,441 772,441 772,530 818,530" fill="none" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#a-blue)"/>

  <!-- never -->
  <rect x="30" y="590" width="1140" height="46" rx="6" fill="rgba(136,19,55,0.25)" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="46" y="609" class="lane" fill="#fb7185">NEVER</text>
  <text x="46" y="626" class="never">network calls · LLM calls from scripts · scripts writing memory or the fact store · credentials · forgetting on the agent's own judgement (* only on a human's word)</text>
</svg>
