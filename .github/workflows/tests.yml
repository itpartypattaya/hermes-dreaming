name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14: Hermes runs gateway and cron scripts on its managed runtime (3.14.9 since 0.22.5), not the venv
        python-version: ["3.9", "3.11", "3.13", "3.14"]
        # stdlib only, as the skill promises; and with PyYAML, as inside the Hermes venv
        pyyaml: [false, true]
    name: unittest (${{ matrix.python-version }}, pyyaml=${{ matrix.pyyaml }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PyYAML
        if: matrix.pyyaml
        run: python -m pip install pyyaml
      # The source of scripts/holo_screen.py, at the commit the copy was made from: without it
      # test_the_copy_matches_the_provider skips, and a drift of the copy goes unseen.
      # Bump the ref together with SOURCE_COMMIT when tools/vendor_screen.py makes a new copy.
      - name: Check out the holographic provider (source of the vendored screen)
        uses: actions/checkout@v4
        with:
          repository: itpartypattaya/hermes-plugin-holographic
          ref: be7702aa7ce1aae90ed5ec33278aefe1882dfba8
          path: _holographic
      - name: The checked-out provider is the commit the copy names
        run: |
          pinned="$(sed -n 's/^SOURCE_COMMIT = "\(.*\)"$/\1/p' skills/dreaming/scripts/holo_screen.py)"
          actual="$(git -C _holographic rev-parse HEAD)"
          echo "holo_screen.py: $pinned, checked out: $actual"
          case "$actual" in "$pinned"*) ;; *) echo "::error::bump the ref above to SOURCE_COMMIT"; exit 1;; esac
      - name: Run tests (stdlib unittest, no network)
        env:
          HOLOGRAPHIC_SRC: ${{ github.workspace }}/_holographic/screen.py
        run: python -m unittest discover -s tests -v

  provider-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out the released merge provider
        uses: actions/checkout@v4
        with:
          repository: itpartypattaya/hermes-plugin-holographic
          ref: 4bcc011c1cef2fd43f23c0a49efe63ef04e74ac8
          path: _holographic019
      - name: Install the provider's declared dependencies
        run: python -m pip install "numpy>=1.26,<3" "snowballstemmer>=2.2,<4"
      - name: Run duplicate tests including the real merge and expect contract
        env:
          HOLOGRAPHIC_PROVIDER: ${{ github.workspace }}/_holographic019
          HOLOGRAPHIC_SRC: ${{ github.workspace }}/_holographic019/screen.py
        run: python -m unittest discover -s tests -p 'test_duplicate*.py' -v
      # Task outcomes (3.6.2): the nightly summary and the manual reports over a journal the provider wrote itself.
      - name: Check out the experience-journal provider (holographic v0.20.1)
        uses: actions/checkout@v4
        with:
          repository: itpartypattaya/hermes-plugin-holographic
          ref: 355e55f1a71a3c472663d226e141cbd901a003f8
          path: _holographic020
      - name: Run task-outcome tests against the provider's own journal
        env:
          HOLOGRAPHIC_PROVIDER: ${{ github.workspace }}/_holographic020
        run: python -m unittest discover -s tests -p 'test_task_outcomes*.py' -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff (pinned)
        run: python -m pip install ruff==0.15.16
      # Errors, undefined names and blind excepts only (every intended one carries `noqa: BLE001` with its
      # reason). Line length, bugbear, simplify and complexity are left out on purpose: dozens of findings
      # with no effect on behaviour (review of 2.9.8).
      - name: ruff
        run: ruff check --select E,F,BLE --ignore E501 skills tests
